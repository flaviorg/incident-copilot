# incident-copilot CI (spec 8.4 and AC-41): backend and web typecheck, backend and web tests, web build,
# check:tokens and check:secrets. No secrets configured: the fake provider runs the tests without network.
# Action major versions checked against the official releases on 2026-10-04 (checkout v7.0.1, setup-node v7.0.0).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm test
      - run: npm run web:verify
      - run: npm run check:tokens
      - run: npm run check:secrets
