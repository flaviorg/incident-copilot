# Publishes the War Room (demo mode) to GitHub Pages. Manual only: nothing is published unless someone dispatches the workflow.
# The deploy runs the web typecheck, the web tests and check:tokens first, so a War Room that fails AC-39 is never published.
# Action major versions checked against the official releases on 2026-10-04.
name: Pages (War Room)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run typecheck:web
      - run: npm run check:tokens
      - run: npm run web:test
      - name: Build the War Room with the recordings (fake provider, no secrets)
        run: npm run web:build
        env:
          VITE_BASE: /incident-copilot/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
