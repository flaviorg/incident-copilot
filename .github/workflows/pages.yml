# Publica a War Room (modo demo) no GitHub Pages. Só manual: nada é publicado sem alguém disparar o workflow.
# Majors das actions conferidas nas releases oficiais em 2026-10-04.
name: Pages (War Room)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - name: Build da War Room com as gravações (provedor fake, sem segredos)
        run: npm run web:build
        env:
          VITE_BASE: /incident-copilot/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
